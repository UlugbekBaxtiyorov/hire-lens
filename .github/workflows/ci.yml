name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Run tests
        run: uv run --locked --directory backend pytest

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:web
      - run: npm run build

  deploy-demo:
    name: Deploy demo
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && vars.DEMO_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
